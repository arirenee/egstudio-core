<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>E.G. Studio Intake</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

body{
font-family:Montserrat,sans-serif;
background:#07090f;
color:#fff;
padding:60px 20px;
}

.container{
max-width:700px;
margin:auto;
}

.card{
background:#0f1320;
padding:40px;
border-radius:16px;
border:1px solid #2a3248;
}

h1{
margin-bottom:12px;
}

p{
color:#a7b3ce;
margin-bottom:30px;
}

.field{
margin-bottom:18px;
}

label{
display:block;
margin-bottom:8px;
font-weight:600;
}

input,
select,
textarea{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid #2a3248;
background:#141a2b;
color:white;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:10px;
font-weight:700;
cursor:pointer;
background:linear-gradient(120deg,#4f7dff,#7ca3ff);
color:white;
}

</style>
</head>
<body>

<div class="container">

<div class="card">

<h1>Pipeline Sprint Intake</h1>

<p>
Complete the intake form below and continue to checkout.
</p>

<form id="intakeForm">

<div class="field">
<label>Agency Name</label>
<input type="text" required>
</div>

<div class="field">
<label>Full Name</label>
<input type="text" required>
</div>

<div class="field">
<label>Email Address</label>
<input type="email" required>
</div>

<div class="field">
<label>Website</label>
<input type="url">
</div>

<div class="field">
<label>Content Type</label>
<select required>
<option value="">Select</option>
<option>Podcast</option>
<option>Webinar</option>
<option>Interview</option>
<option>Presentation</option>
<option>Mixed Content</option>
</select>
</div>

<div class="field">
<label>Monthly Volume</label>
<select required>
<option value="">Select</option>
<option>1-5 Assets</option>
<option>5-15 Assets</option>
<option>15-30 Assets</option>
<option>30+ Assets</option>
</select>
</div>

<div class="field">
<label>Additional Notes</label>
<textarea rows="5"></textarea>
</div>

<button type="submit">
Continue to Checkout
</button>

</form>

</div>

</div>

<script>
document
.getElementById("intakeForm")
.addEventListener("submit", function(e){

e.preventDefault();

window.location.href =
"https://buy.stripe.com/aFabIU9yVc6I9zl5ZX9EI06";

});
</script>

</body>
</html>
